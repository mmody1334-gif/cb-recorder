name: Universal Cloud Live Stream Recorder

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Live Stream Target or URL"
        required: true
      chat_id:
        description: "Telegram Chat ID to notify"
        required: true
      bot_token:
        description: "Telegram Bot Token"
        required: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug Stripchat Probe
        run: |
          python debug_stripchat.py
